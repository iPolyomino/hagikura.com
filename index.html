<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="「萩倉」を毛筆の行書体で表示するシンプルな Web ページです。PC では横書き、スマートフォンでは縦書きで表示します。">

  <title>萩倉</title>

  <style>
    @font-face {
      font-family: "Kouzan Gyousho";
      src: url("./fonts/KouzanGyousho-Hagikura.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;

      min-height: 100dvh;

      background:
        radial-gradient(
          circle at 25% 20%,
          rgba(65, 50, 30, 0.025),
          transparent 35%
        ),
        radial-gradient(
          circle at 75% 80%,
          rgba(65, 50, 30, 0.02),
          transparent 40%
        ),
        #f3efe5;

      color: #181714;

      overflow: hidden;
    }

    .hagikura {
      margin: 0;

      font-family: "Kouzan Gyousho", serif;
      font-size: clamp(8rem, 22vw, 20rem);
      font-weight: 400;
      line-height: 1;

      letter-spacing: 0.08em;

      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;

      transform: translateX(0.04em);
    }

    @media (max-width: 600px) {
      .hagikura {
        writing-mode: vertical-rl;
        text-orientation: upright;

        font-size: clamp(8rem, 38vw, 13rem);
        letter-spacing: 0.05em;

        transform: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1 class="hagikura">萩倉</h1>
  </main>
</body>
</html>
